<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwoolKit Desktop — Workspace Loader</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090b10;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 480px;
      width: 90%;
      background: #0f141f;
      border: 1px solid #1e2638;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 26px;
      color: #fff;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 20px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin: 4px;
    }
    .btn-secondary {
      background: #161c2b;
      color: #cbd5e1;
      border: 1px solid #1e2638;
    }
    .status {
      margin-top: 16px;
      font-family: monospace;
      font-size: 11px;
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">T</div>
    <h1>TwoolKit Desktop v1.2.0</h1>
    <p id="desc">
      Synchronizing with the live TwoolKit workspace...
    </p>
    <div>
      <button class="btn" onclick="connectLive()">Launch Live Workspace</button>
      <button class="btn btn-secondary" onclick="connectLocal()">Connect Localhost (3000)</button>
    </div>
    <div class="status" id="status">Checking connectivity...</div>
  </div>
  <script>
    const LIVE_URL = "https://twoolkit.vercel.app";
    const LOCAL_URL = "http://127.0.0.1:3000";

    async function probe(url) {
      try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 2500);
        const r = await fetch(url + "/api/health", { signal: ctrl.signal, cache: "no-store" });
        return r.ok;
      } catch {
        return false;
      }
    }

    async function connectLive() {
      document.getElementById("status").textContent = "Connecting to " + LIVE_URL + "...";
      window.location.replace(LIVE_URL);
    }

    async function connectLocal() {
      document.getElementById("status").textContent = "Connecting to " + LOCAL_URL + "...";
      window.location.replace(LOCAL_URL);
    }

    (async () => {
      if (await probe(LOCAL_URL)) {
        window.location.replace(LOCAL_URL);
        return;
      }
      if (navigator.onLine && (await probe(LIVE_URL))) {
        window.location.replace(LIVE_URL);
        return;
      }
      document.getElementById("desc").textContent =
        "Offline Mode Detected. Start the local TwoolKit service on port 3000 or reconnect to synchronize with twoolkit.vercel.app.";
      document.getElementById("status").textContent = "Offline · Native Rust Core Active";
    })();
  </script>
</body>
</html>
