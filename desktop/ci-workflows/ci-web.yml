name: Web & Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/ci-web.yml'

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: Next.js TypeScript & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build production Next.js bundle
        env:
          NEXT_PUBLIC_APP_VERSION: '1.2.0'
          NEXT_PUBLIC_MIN_DESKTOP_VERSION: '1.0.0'
        run: npm run build

  backend-verify:
    name: FastAPI Backend Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system PDF/image/office libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf libmagic1 libreoffice ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Start FastAPI background server
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run backend QA audit and smoke test suites
        run: |
          python tests/smoke_test.py
          python tests/qa_full_audit.py
