[package]
name = "twoolkit-desktop"
version = "1.2.0"
description = "TwoolKit Desktop — Universal File Intelligence, PDF & Conversion Platform"
authors = ["Aditya Misra"]
license = "MIT"
repository = "https://github.com/aditya-misra346/TwoolKit"
edition = "2021"
rust-version = "1.87"

[lib]
name = "twoolkit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"
walkdir = "2.5"
dirs = "5.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
